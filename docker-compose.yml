version: '3.8'

services:
  # Main draw.io application
  drawio:
    build:
      context: .
      dockerfile: Dockerfile
    image: drawio:latest
    container_name: drawio-app
    ports:
      - "8080:8080"
    environment:
      - CATALINA_OPTS=-Xms512m -Xmx1024m
    volumes:
      # Mount for development (optional - comment out for production)
      # - ./src/main/webapp:/usr/local/tomcat/webapps/ROOT:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - drawio-network

  # Test runner service
  drawio-tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    image: drawio-tests:latest
    container_name: drawio-tests
    volumes:
      - ./tests:/app/tests
      - test-results:/app/test-results
    environment:
      - NODE_ENV=test
    profiles:
      - test
    networks:
      - drawio-network

  # Nginx reverse proxy (optional - for production)
  nginx:
    image: nginx:alpine
    container_name: drawio-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - drawio
    profiles:
      - production
    restart: unless-stopped
    networks:
      - drawio-network

networks:
  drawio-network:
    driver: bridge

volumes:
  test-results:
    driver: local
