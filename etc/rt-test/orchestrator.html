	{
		document.title = 'RTFAIL';
		document.getElementById('status').textContent =
			'unknown scenario: ' + scenarioName;

		return;
	}

		seed: parseInt(params['seed'] || '1', 10),
		scenario: scenarioName,
		clients: parseInt(params['clients'] || scenario.clients, 10),
		rounds: parseInt(params['rounds'] || scenario.rounds, 10),
		opsPerRound: parseInt(params['ops'] || scenario.opsPerRound, 10)

	{
		scenario.conflictEvery = parseInt(params['conflicts'], 10);
	}

	// cleanup; rounds only perform ops with seeded human think-time
	var realTiming = params['timing'] == 'real';
	RtHarness.realTiming = realTiming;
	RtHarness.realGraceMs = (params['grace'] != null) ?
		parseInt(params['grace'], 10) : null;

	{
		statusEl.textContent = msg;
		console.log('[rt-test]', msg);
	};

	function initialXml()
	{
		return '<mxfile><diagram id="page-a" name="Page-A">' +
			'<mxGraphModel><root><mxCell id="0"/>' +
			'<mxCell id="1" parent="0"/></root></mxGraphModel></diagram>' +
			'<diagram id="page-b" name="Page-B">' +
			'<mxGraphModel><root><mxCell id="0"/>' +
			'<mxCell id="1" parent="0"/></root></mxGraphModel></diagram>' +
			'</mxfile>';
	};

	async function main()
	{
		var report = new RtHarness.Report(config);

		// Diagnosis: include the trace in passing verdicts too (eg.
		// checksum reloads under real timing do not fail the run)
		report.alwaysTrace = params['trace'] == 'always';
		report.traceTail = params['trace'] == 'tail';

		// Watchdog: a hang must still produce a verdict for the runner
		window.setTimeout(function()
		{
			if (window.__RT_RESULT == null)
			{
				report.fail('watchdog', 'no verdict after watchdog, last: ' +
					statusEl.textContent.split('\n')[0]);
				finish(report);
			}
		}, parseInt(params['watchdog'] || '240', 10) * 1000);
		var rand = new RtHarness.Rand(config.seed);
		var container = document.getElementById('clients');
		var clients = [];

		try
		{
			for (var i = 0; i < config.clients; i++)
			{
				var c = new RtHarness.Client(i, container, report);
				if (scenario.script == 'rolloutMixedSource' && i == 1) c.bootUrl = '/rt-v6' + c.bootUrl;
				c.saveFailEvery = scenario.saveFailEvery || 0;
				clients.push(c);
			}

			// Debug access for interactive repros
			window.__clients = clients;

			status('booting ' + clients.length + ' clients...');
			await Promise.all(clients.map(function(c) { return c.boot(); }));
			if (scenario.backend == 'onedrive')
			{
				await Promise.all(clients.map(RtDescriptorBackend.loadOneDrive));
			}

			var broker = new RtHarness.Broker(clients, scenario.delivery,
				rand, report);
			broker.backend = scenario.backend || 'direct';
			var xml = initialXml();

			for (var i = 0; i < clients.length; i++)
			{
				// lateJoin: the last client joins from inside the script
				// via joinLate (saved base + live-log catchup) instead
				// of starting with the initial file
				if (scenario.lateJoin && i == clients.length - 1)
				{
					clients[i].unjoined = true;
				}
				else
				{
					clients[i].injectFile(xml, broker);
				}
			}

			var generator = new RtHarness.OpGenerator(rand, clients, report);

			generator.skipOps = (params['skipops'] != null) ?
				params['skipops'].split(',') : (scenario.skipOps || null);
			generator.boostOps = (params['boostops'] != null) ?
				params['boostops'].split(',') : (scenario.boostOps || null);
			var asserter = new RtHarness.Asserter(clients, generator, report);

			// Shared context for scripted scenarios that mix scripted
			// phases with seed-varied generator ops
			var ctx = {rand: rand, generator: generator,
				asserter: asserter, config: config};

			// --- Scripted scenario instead of random rounds ---
			if (scenario.script == 'rolloutMixedSource')
			{
				await RtRollout.run(clients, broker, report, params);
				finish(report);
				return;
			}
			else if (scenario.script == 'coverage')
			{
				status('running ' + scenarioName + '...');
				await RtCoverage.run(clients, broker, report, ctx);
			}
			else if (scenario.script == 'layoutRace')
			{
				status('running layout-race script...');
				await RtHarness.runLayoutRace(clients, broker, report);
			}
			else if (scenario.script == 'adoptionRace')
			{
				status('running adoption-race script...');
				await RtHarness.runAdoptionRace(clients, broker, report);
			}
			else if (scenario.script == 'layoutPassive')
			{
				status('running layout-passive script...');
				await RtHarness.runLayoutPassive(clients, broker, report);
			}
			else if (scenario.script == 'pageOrderRace')
			{
				status('running page-order-race script...');
				await RtHarness.runPageOrderRace(clients, broker, report);
			}
			else if (scenario.script == 'pageAdoptionRace')
			{
				status('running page-adoption-race script...');
				await RtHarness.runPageAdoptionRace(clients, broker, report);
			}
			else if (scenario.script == 'pageAdoptionEditRace')
			{
				status('running page-adoption-edit-race script...');
				await RtHarness.runPageAdoptionEditRace(clients, broker, report);

			{

			{

			{
				status('running revoke-storm script...');
				await RtHarness.runRevokeStorm(clients, broker, report, ctx);
			}
			else if (scenario.script == 'perfGate')
			{
				status('running perf-gate script...');
				await RtHarness.runPerfGate(clients, broker, report, ctx);
			}
			else if (scenario.script == 'contradictingOps')
			{
				status('running contradicting-ops script...');
				await RtHarness.runContradictingOps(clients, broker,
					report, ctx);
			}
			else if (scenario.script == 'syncLatency')
			{
				status('running sync-latency script...');
				await RtHarness.runSyncLatency(clients, broker, report, ctx);
			}
			else if (scenario.script == 'conflictWindowDiff')
			{
				status('running conflict-window-diff script...');
				await RtHarness.runConflictWindowDiff(clients, broker,
					report, ctx);
			}
			else if (scenario.script == 'deferredNotify')
			{
				status('running deferred-notify script...');
				await RtHarness.runDeferredNotify(clients, broker, report, ctx);
			}
			else if (scenario.script == 'batchIsolation')
			{
				status('running batch-isolation script...');
				await RtHarness.runBatchIsolation(clients, broker, report, ctx);
			}

			// --- Edit rounds ---
			for (var round = 0; round < config.rounds &&
				report.failures.length < 25; round++)
			{
				status('round ' + (round + 1) + '/' + config.rounds +
					' (seed ' + config.seed + ', ' + scenarioName + ')');

				for (var i = 0; i < clients.length; i++)
				{
					for (var op = 0; op < config.opsPerRound; op++)
					{
						generator.randomOp(clients[i]);

						// Human think-time between ops: deliveries,
						// debounced flushes and autosaves interleave
						// with the editing like in production
						if (realTiming)
						{
							await RtHarness.sleep(40 + rand.int(200));
						}
					}
				}

				if (scenario.conflictEvery > 0 &&
					round % scenario.conflictEvery == scenario.conflictEvery - 1 &&
					clients.length > 1)
				{
					var a = rand.int(clients.length);
					var b = (a + 1 + rand.int(clients.length - 1)) %
						clients.length;
					generator.conflictOp(clients[a], clients[b]);
				}

				if (realTiming)
				{
					// Production timers drive flush, autosave and
					// cleanup; the round only paces like a human pause
					await broker.drain();
					await RtHarness.sleep(300 + rand.int(1200));

					continue;
				}

				// Laggy flushes: some clients accumulate changes across
				// rounds; flush order is seeded
				var order = clients.slice();

				for (var i = order.length - 1; i > 0; i--)
				{
					var j = rand.int(i + 1);
					var tmp = order[i];
					order[i] = order[j];
					order[j] = tmp;
				}

				for (var i = 0; i < order.length; i++)
				{
					if (!rand.chance(scenario.flushSkip))
					{
						order[i].flush();
					}
				}

				// Mid-traffic save: data generation flushes while remote
				// messages are still queued for delivery
				var savePending = scenario.saveEvery > 0 &&
					round % scenario.saveEvery == scenario.saveEvery - 1;
				var savePromise = null;

				if (savePending && scenario.saveDuringTraffic)
				{
					savePromise = clients[rand.int(clients.length)]
						.save(scenario.saveLatency);
				}

				await broker.drain();
				await RtHarness.sleep(80);

				if (savePending && !scenario.saveDuringTraffic)
				{
					savePromise = clients[rand.int(clients.length)]
						.save(scenario.saveLatency);
				}

				if (savePromise != null)
				{
					await savePromise;
					await broker.drain();
					await RtHarness.sleep(60);
				}

				// Occasional cleanup on an unmodified client
				if (rand.chance(0.3))
				{
					var candidate = clients[rand.int(clients.length)];

					if (!candidate.file.isModified())
					{
						candidate.cleanupNow();
					}
				}
			}

			if (realTiming)
			{
				// Lets the production timers finish organically before
				// the final arbitration: flush debounce (300ms),
				// autosave (1.5s) plus its save, and the 15s cleanup
				// that adopts the saved order on screen
				status('settling on production timers...');
				var settleUntil = Date.now() + 20000;

				while (Date.now() < settleUntil)
				{
					await broker.drain();
					await RtHarness.sleep(500);
				}
			}

			// --- Quiescence: iterate flush/save/cleanup cycles to the
			// convergence fixpoint. The realtime protocol is eventually
			// consistent: receivers only get remote changes into
			// ownPages via save merges and onto the screen via cleanup,
			// so convergence after activity stops can take several
			// cycles (like production). The number of cycles needed is
			// itself a regression signal (stats.convergenceRounds).
			var converged = false;
			var cycle = 0;

			// The serial save chain arbitrates one client per cycle, so
			// large fleets (and injected save failures eating cycles)
			// legitimately need more quiescence cycles than the sharp
			// default that guards the 2-3 client scenarios
			var maxCycles = parseInt(params['cycles'] ||
				String(6 + Math.max(0, config.clients - 3)), 10);

			for (cycle = 1; cycle <= maxCycles && !converged; cycle++)
			{
				status('quiescing: cycle ' + cycle + ': flush');

				for (var i = 0; i < 8; i++)
				{
					for (var j = 0; j < clients.length; j++)
					{
						clients[j].flush();
					}

					await broker.drain();
					await RtHarness.sleep(60);

					if (!broker.hasPending())
					{
						break;
					}
				}

				// Saves serialized and delivered before the next save
				// starts, as the real providers serialize via etag.
				// Only modified clients save: production autosave never
				// fires on unmodified files, so client-local state that
				// bypasses the modified flag must not converge through
				// artificial saves here
				for (var i = 0; i < clients.length; i++)
				{
					if (clients[i].file.isModified())
					{
						status('quiescing: cycle ' + cycle + ': save client ' + i);
						var outcome = await clients[i].save(0);
						if (broker.backend == 'descriptor' && outcome.status == 'committed')
						{
							await Promise.all(clients.map(function(c)
							{
								return RtDescriptorBackend.revision(c, outcome.committedRevision);
							}));
						}
						await broker.drain();
						await RtHarness.sleep(60);
					}
				}

				for (var i = 0; i < clients.length; i++)
				{
					clients[i].cleanupNow();
				}

				await broker.drain();
				await RtHarness.sleep(60);

				// Regression lock for the lossy single-pass cleanup
				// class (dropped updates, lost pages): after the first
				// cleanup nothing may exist in the own pages that is
				// missing from the visible pages - applying own to the
				// screen is exactly the cleanup's job. The OTHER
				// direction (visible but not in own) is legitimate:
				// another client's unsaved content lives in ui and
				// theirPages only until its creator saves (transient
				// hole, found by the 4-client stress pass). Field
				// residue converges over further cycles and stays
				// covered by the fixpoint verdicts.
				// Checked after the SECOND cycle: within cycle 1 a
				// merge from the serial save chain can land after the
				// receiver's own save and before its cleanup, leaving
				// a one-cycle existence lag that the next cleanup
				// heals - the lossy class this lock guards against
				// does NOT heal over cleanup cycles.
				if (cycle == 2)
				{
					// diffPages(ui, own): 'i' entries exist in own and
					// are missing from ui ('i'/'u' are
					// EditorUi.DIFF_INSERT/UPDATE - EditorUi only
					// exists inside the client frames)
					var existenceResidue = function(residue)
					{
						if (residue.i != null)
						{
							return true;
						}

						if (residue.u != null)
						{
							for (var pid in residue.u)
							{
								var cells = residue.u[pid].cells;

								if (cells != null && cells.i != null)
								{
									return true;
								}
							}
						}

						return false;
					};

					for (var i = 0; i < clients.length; i++)
					{
						var residue = clients[i].ui.diffPages(
							clients[i].ui.pages, clients[i].file.ownPages);

						if (existenceResidue(residue))
						{
							report.fail('single-pass-cleanup', 'client' + i +
								' cell or page existence differs between ui ' +
								'and own pages after first cleanup: ' +
								JSON.stringify(residue).substring(0, 300));
						}
					}
				}

				// Fixpoint check: no traffic, no pending debounced flush
				// (a reactive correction can restore the ownPages state -
				// empty ui-vs-own diff - while its flush is still armed:
				// the snapshot holds the raw incoming patch, so the flush
				// fires into the assertion phase as a late echo), screens
				// equal across clients, screen == save state everywhere
				converged = !broker.hasPending();

				for (var i = 0; i < clients.length && converged; i++)
				{
					converged = !clients[i].sync.localFileWasChanged &&
						clients[i].win.mxUtils.isEmptyObject(
						clients[i].ui.diffPages(clients[i].ui.pages,
							clients[i].file.ownPages)) &&
						(i == 0 || clients[i].getPagesHash() ==
							clients[0].getPagesHash());
				}
			}

			report.stats.convergenceRounds = cycle - 1;

			// A scenario that deliberately feeds ONE client content the
			// others never saw (hostile patches) cannot converge by
			// construction - it asserts survival and the health of the
			// innocent clients instead, in its own script
			var expectDivergence = scenario.expectDivergence == true;

			if (!converged && !expectDivergence)
			{
				report.fail('no-fixpoint', 'not converged after ' +
					(cycle - 1) + ' quiescence cycles');
			}

			// --- Assertions ---
			if (!expectDivergence)
			{
				status('asserting: convergence...');
				asserter.assertConvergence('final');
				status('asserting: snapshot...');
				asserter.assertSnapshotInvariant('final');
				status('asserting: alignment...');
				asserter.assertRealtimeAlignment('final');
			}
			if (!expectDivergence)
			{
				status('asserting: echo probe...');
				await asserter.assertNoEcho(broker, 3);
				status('asserting: markers...');
				asserter.assertMarkers();
			}

			// Rendering is asserted even for hostile input: a patched
			// client may hold different content, but never unrenderable
			// content
			status('asserting: render consistency...');
			asserter.assertRenderConsistency('final');

			// The view-independent half over EVERY page: which page is
			// current at the end of a random scenario is arbitrary
			asserter.assertRenderableEdges('final');

			// Same reasoning: whatever a hostile patch does to the
			// content, the viewed page must still be in the document
			status('asserting: current page...');
			asserter.assertCurrentPage('final');

			// A checksum mismatch heals itself, so it is invisible to
			// every content verdict unless the count is asserted
			status('asserting: reloads...');
			asserter.assertNoReloads(scenario.reloadBudget, 'final');

			// And the persisted bytes must hold what the clients agreed
			// on - they only ever compare themselves to each other
			if (!expectDivergence && !scenario.skipSavedFile)
			{
				status('asserting: saved file...');
				asserter.assertSavedFile(broker, 'final');
			}

			if (scenario.script == 'pageAdoptionEditRace')
			{
				RtHarness.assertFinalPageAdoptionEdits(clients, broker, report);
			}

			if (scenario.script == 'layoutPassive')
			{
				RtHarness.assertFinalStackConsistent(clients, broker,
					report, 'lp0');
			}
		}
		catch (e)
		{
			report.fail('harness-exception', e.message + '\n' +
				((e.stack != null) ? e.stack.split('\n')
					.slice(0, 5).join('\n') : ''));
		}

		finish(report);
	};

	function finish(report)
	{
		if (window.__RT_RESULT != null)
		{
			return;
		}

		var result = report.finish();
		window.__RT_RESULT = result;
		document.title = result.pass ? 'RTPASS' : 'RTFAIL';
		statusEl.className = result.pass ? 'pass' : 'fail';
		status((result.pass ? 'PASS' : 'FAIL') + ' seed=' + result.seed +
			' scenario=' + result.scenario + ' (' + result.durationMs +
			'ms, ' + result.stats.messages + ' msgs)\n' +
			JSON.stringify(result, null, 2));

		if (params['report'] == '1')
		{
			try
			{
				fetch('/rt-result', {method: 'POST',
					headers: {'Content-Type': 'application/json'},
					body: JSON.stringify(result)});
			}
			catch (e)
			{
				// Standalone run without runner
			}
		}
	};

	window.addEventListener('load', function()
	{
		main();
	});
})();
